		<div id="app"></div>

		<!-- HUD -->
		<div id="hud" class="hidden">
			<section id="hud-status" class="win">
				<header class="win-bar"><span id="hud-name">HAZEL.52HZ</span><i></i></header>
				<div class="win-body">
					<div id="hearts" data-i18n-aria="hud.hearts"></div>
					<div class="meter-row">
						<span class="mono tiny">STAMINA</span>
						<div id="stamina" class="meter"><div></div></div>
					</div>
				</div>
			</section>

			<!-- PC: HAZEL 창 아래 작은 조작 안내 -->
			<div id="hud-keys" class="key-only">
				<span><kbd>WASD</kbd><em data-i18n="hud.keys.swim"></em></span>
				<span><kbd>Shift</kbd><em data-i18n="hud.keys.boost"></em></span>
				<span><kbd>Space</kbd><em data-i18n="hud.keys.jump"></em></span>
				<span><kbd>E</kbd><em data-i18n="hud.keys.sing"></em></span>
			</div>

			<section id="hud-objective" class="win">
				<header class="win-bar"><span id="obj-chapter">PROLOGUE</span><i></i></header>
				<div class="win-body">
					<div id="obj-text">—</div>
					<div id="obj-dist" class="mono tiny"></div>
				</div>
			</section>

			<section id="hud-party" class="win">
				<header class="win-bar"><span>POD</span><i></i></header>
				<div class="win-body">
					<div id="party"></div>
					<div class="party-meta">
						<button id="btn-journal" class="chip" data-i18n-title="hud.journal">✉ <b id="bottle-count">0/6</b></button>
						<button id="btn-mute" class="chip" data-i18n-title="hud.mute">♪</button>
						<button id="btn-pause" class="chip" data-i18n-title="hud.pause">❚❚</button>
						<a id="btn-home" class="chip" href="../" data-i18n-title="hud.home" data-i18n-aria="hud.home"><svg aria-hidden="true"><use href="#whale-mark"/></svg></a>
					</div>
				</div>
			</section>

			<section id="hud-boss" class="win hidden">
				<header class="win-bar"><span data-i18n="hud.boss">MOBY DICK</span><i></i></header>
				<div class="win-body"><div id="boss-gauge"></div><div id="boss-hint" class="mono tiny"></div></div>
			</section>

			<div id="minimap-wrap" class="win">
				<header class="win-bar"><span>SONAR</span><span id="compass-meter" hidden><small>COMPASS</small><span class="gauge"><span class="fill"></span></span></span><i></i></header>
				<canvas id="minimap" width="180" height="180"></canvas>
			</div>

			<div id="marker" class="hidden"><div class="diamond"></div><span></span></div>
			<div id="edge-arrow" class="hidden"><div class="arrow"></div><span></span></div>
			<div id="prompt" class="hidden"></div>
			<div id="toasts"></div>
			<div id="banner" class="hidden"><small></small><strong></strong><em></em></div>
		</div>

		<!-- 대화 -->
		<div id="dialog" class="win hidden">
			<header class="win-bar"><span id="dialog-name"></span><i></i></header>
			<div class="win-body">
				<div id="dialog-portrait"></div>
				<p id="dialog-text"></p>
				<span id="dialog-next">▼</span>
			</div>
		</div>

		<!-- 따라 부르기 -->
		<div id="song" class="win hidden">
			<header class="win-bar"><span id="song-title">52HZ</span><i></i></header>
			<div class="win-body">
				<div id="song-beats"></div>
				<p id="song-hint"></p>
			</div>
		</div>

		<!-- 스텔라와 듀엣 (리듬 게임) -->
		<div id="duet" class="win hidden">
			<header class="win-bar"><span id="duet-title">DUET</span><i></i></header>
			<div class="win-body">
				<div id="duet-track">
					<div class="duet-lane" data-lane="S"><b>♪</b></div>
					<div class="duet-lane" data-lane="J"><b>⤴</b></div>
					<div id="duet-line"></div>
				</div>
				<div id="duet-info"><span id="duet-judge"></span><span id="duet-stars"></span><span id="duet-combo"></span></div>
				<p id="duet-help"></p>
			</div>
		</div>

		<!-- 챕터 카드 -->
		<div id="card" class="hidden">
			<div class="card-inner">
				<small id="card-num"></small>
				<h1 id="card-title"></h1>
				<p id="card-sub"></p>
				<div id="card-extra"></div>
			</div>
		</div>

		<!-- 편지 -->
		<div id="letter" class="overlay hidden">
			<div class="win paper">
				<header class="win-bar"><span id="letter-head">LETTER.TXT</span><i></i></header>
				<div class="win-body">
					<div id="letter-body"></div>
					<div id="letter-from"></div>
					<button class="btn" data-close data-i18n="letter.close"></button>
				</div>
			</div>
		</div>

		<!-- 편지함 -->
		<div id="journal" class="overlay hidden">
			<div class="win">
				<header class="win-bar"><span data-i18n="journal.title">MAILBOX</span><i></i></header>
				<div class="win-body">
					<ul id="journal-list"></ul>
					<button class="btn" data-close data-i18n="journal.close"></button>
				</div>
			</div>
		</div>

		<!-- 일시정지 -->
		<div id="pause" class="overlay hidden">
			<div class="win">
				<header class="win-bar"><span>PAUSE</span><i></i></header>
				<div class="win-body">
					<div class="help touch-only" data-i18n="pause.helpTouch"></div>
					<div class="lab touch-only">
						<div class="lab-head"><span class="mono tiny" data-i18n="lab.title"></span><button class="chip" id="btn-tilt" type="button" aria-pressed="false"></button></div>
						<p class="lab-note" data-i18n="lab.note"></p>
						<p class="lab-note warn" id="lab-status" data-i18n="lab.denied" hidden></p>
					</div>
					<div class="help key-only" data-i18n="pause.helpKeys"></div>
					<label class="name-field" for="nickname-pause">
						<span class="mono tiny">NICKNAME</span>
						<input id="nickname-pause" type="text" maxlength="10" data-name-placeholder autocomplete="off" spellcheck="false">
					</label>
					<div class="row">
						<button class="btn" id="btn-resume" data-i18n="pause.resume"></button>
						<button class="btn ghost" id="btn-restart" data-i18n="pause.restart"></button>
					</div>
				</div>
			</div>
		</div>

		<!-- 타이틀 -->
		<div id="title" class="overlay">
			<a class="home-link" href="../">◀ FROM. WHALE</a>
			<div class="title-inner">
				<svg id="logo-whale" viewBox="40 40 400 300" aria-hidden="true"><path id="logo-path"/></svg>
				<h1 class="logo">From<span>.</span> Whale<small class="beta">BETA</small></h1>
				<p class="tagline" data-i18n="title.tagline"></p>
				<div id="loading" class="mono tiny">LOADING <span id="load-pct">0%</span><div class="meter"><div id="load-bar"></div></div></div>
				<div id="title-buttons" class="hidden">
					<div class="lang-switch" role="group" aria-label="Language">
						<button type="button" data-lang="ko" lang="ko">한국어</button>
						<button type="button" data-lang="en" lang="en">English</button>
						<button type="button" data-lang="ja" lang="ja">日本語</button>
					</div>
					<label class="name-field" for="nickname">
						<span class="mono tiny">NICKNAME</span>
						<input id="nickname" type="text" maxlength="10" data-name-placeholder autocomplete="off" spellcheck="false" enterkeyhint="go">
					</label>
					<div class="title-row">
						<button class="btn big" id="btn-start" data-i18n="title.start"></button>
						<button class="btn ghost hidden" id="btn-continue" data-i18n="title.continue"></button>
					</div>
					<p id="title-endings" class="mono tiny hidden"></p>
				</div>
				<p class="quote" data-i18n="title.quote"></p>
				<p class="controls mono tiny key-only">WASD MOVE · SHIFT BOOST · SPACE JUMP · E SING 52HZ</p>
				<p class="controls mono tiny touch-only">STICK MOVE · » BOOST · ⤴ JUMP · ♪ SING 52HZ</p>
			</div>
		</div>

		<!-- 엔딩 -->
		<div id="ending" class="overlay hidden">
			<div class="win">
				<header class="win-bar"><span id="ending-head">THE END</span><i></i></header>
				<div class="win-body">
					<p class="quote big" id="ending-quote"></p>
					<div id="ending-stats" class="mono tiny"></div>
					<ul id="ending-list"></ul>
					<div class="row">
						<button class="btn hidden" id="btn-search"></button>
						<button class="btn ghost" id="btn-again" data-i18n="ending.again"></button>
					</div>
					<!-- 아이디어 · 버그 보내기 (Netlify Forms) -->
					<button class="chip" id="btn-feedback" type="button" data-i18n="feedback.open"></button>
					<form id="feedback" name="feedback" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
						<input type="hidden" name="form-name" value="feedback">
						<p hidden><label>bot <input name="bot-field"></label></p>
						<input type="hidden" name="info">
						<textarea name="message" rows="3" maxlength="1500"></textarea>
						<div class="row"><button class="btn" type="submit" data-i18n="feedback.send"></button></div>
						<p id="feedback-status"></p>
					</form>
				</div>
			</div>
		</div>

		<div id="fade"></div>
		<div id="error" class="hidden"></div>

		<!-- 모바일 조작 -->
		<div id="touch" class="hidden">
			<div id="stick"><div id="stick-knob"></div></div>
			<div id="touch-buttons">
				<button data-act="sing">♪<small>52Hz</small></button>
				<button data-act="jump">⤴<small>JUMP</small></button>
				<button data-act="boost">»<small>BOOST</small></button>
			</div>
		</div>
	</body>
</html>
